# =============================================================================
# PHP Project Configuration
# Uso: init-php.sh mi-proyecto.conf
# /home/hans/proyectos/project-starter/php/init-php.sh project.conf
# =============================================================================

# Puerto HTTP local para el entorno dev
HTTP_PORT=4455

# -----------------------------------------------------------------------------
# Módulos (true / false)
# -----------------------------------------------------------------------------

# Framework Symfony
USE_SYMFONY=true
# Tipo de instalación Symfony:
#   minimal = skeleton base; instala solo lo necesario según módulos
#   webapp  = distribución completa para aplicaciones web
SYMFONY_INSTALL=minimal

# Base de datos (Doctrine + MySQL)
USE_DB=true

# Host/puerto de tu MySQL externo (no se crea un servicio db en este starter)
# Si usas el starter mysql en una red compartida, DB_HOST debe ser el nombre
# del contenedor MySQL (por ejemplo: mi-mysql_db) y DB_NETWORK la red Docker.
DB_HOST=mysql-dbcentral_db
DB_PORT=3306
DB_NAME=mrv
DB_USER=desarrollador
DB_PASSWORD=secret_password
DB_NETWORK=mysql-dbcentral_net

# Usuario inicial de desarrollo si USE_AUTH=true
ADMIN_LOGIN=admin
ADMIN_PASSWORD=admin123

# Autenticación con Symfony Security
USE_AUTH=true

# JWT — solo aplica si USE_AUTH=true
USE_JWT=true

# Panel de administración EasyAdmin (requiere USE_DB=true)
USE_ADMIN=true
