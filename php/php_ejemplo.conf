# =============================================================================
# PHP Project Configuration
# Uso: init-php.sh mi-proyecto.conf
# /home/hans/proyectos/project-starter/php/init-php.sh project.conf
# =============================================================================

# Versión de PHP
PHP_VERSION=8.4

# Puertos
PORT_DEV=8080
PORT_PROD=80

# Servidor de producción (opcional)
PROD_SERVER_IP=

# =============================================================================
# Módulos
# =============================================================================

# Framework Symfony
USE_SYMFONY=true
# Tipo de instalación Symfony:
#   minimal = skeleton base; instala solo lo necesario según módulos
#   webapp  = distribución completa para aplicaciones web
SYMFONY_INSTALL=minimal

# Autenticación
USE_AUTH=true

# JWT
USE_JWT=false

# Admin
USE_ADMIN=true

# Sistema de Backup con auditoría automática
BACKUP_CONTAINER_NAME=mrv.backup-dev

# =============================================================================
# VARIABLES DE BASE DE DATOS DE DESARROLLO (DEV)
# =============================================================================
DB_HOST_DEV=host.docker.internal
DB_PORT_DEV=3306
DB_NAME_DEV=miproyecto_dev
DB_USER_DEV=app
DB_PASSWORD_DEV=secret
# Red Docker compartida (vacío = usa proyectos-net por defecto)
DB_NETWORK_DEV=

# =============================================================================
# VARIABLES DE BASE DE DATOS DE PRODUCCIÓN (PROD)
# =============================================================================
DB_HOST_PROD=host.docker.internal
DB_PORT_PROD=3306
DB_NAME_PROD=miproyecto_prod
DB_USER_PROD=app
DB_PASSWORD_PROD=secret
# Red Docker compartida (vacío = usa proyectos-net por defecto)
DB_NETWORK_PROD=


# =============================================================================
# Usuario Admin (solo si USE_AUTH=true)
# =============================================================================
ADMIN_LOGIN=admin
ADMIN_PASSWORD=admin123

# =============================================================================
# JWT (solo si USE_JWT=true)
# =============================================================================
JWT_PASSPHRASE=changeme
