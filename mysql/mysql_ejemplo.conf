# =============================================================================
# Configuración del Contenedor MySQL
# Uso: init-mysql.sh project_ejemplo.conf
# =============================================================================

# Versión de la imagen oficial de MySQL (ej: 8.0, 8.4, latest)
MYSQL_VERSION=latest

# IP del servidor de producción (opcional)
PROD_SERVER_IP=

# =============================================================================
# VARIABLES DE DESARROLLO (DEV)
# =============================================================================
# Puerto local dev mapeado en el host
MYSQL_PORT_DEV=3321
# Nombre de la base de datos de desarrollo
DB_NAME_DEV=app_db
# Usuario inicial de desarrollo
DB_USER_DEV=desarrollador
# Contraseña del usuario inicial de desarrollo
DB_PASSWORD_DEV=desarrollador123
# Contraseña del usuario ROOT de desarrollo
DB_ROOT_PASSWORD_DEV=root123
# Red Docker compartida para desarrollo
DB_NETWORK_DEV=

# =============================================================================
# VARIABLES DE PRODUCCIÓN (PROD)
# =============================================================================
# Puerto local prod mapeado en el host
MYSQL_PORT_PROD=3322
# Nombre de la base de datos de producción
DB_NAME_PROD=app_db
# Usuario inicial de producción
DB_USER_PROD=desarrollador
# Contraseña del usuario inicial de producción
DB_PASSWORD_PROD=desarrollador123
# Contraseña del usuario ROOT de producción
DB_ROOT_PASSWORD_PROD=root123
# Red Docker compartida para producción
DB_NETWORK_PROD=


