# =============================================================================
# Configuración del Contenedor MySQL
# Uso: init-mysql.sh project_ejemplo.conf
# =============================================================================

# Versión de la imagen oficial de MySQL (ej: 8.0, 8.4, latest)
MYSQL_VERSION=latest

# Puerto local mapeado en el host
MYSQL_PORT=3306

# Usuario inicial (distinto de root)
DB_USER=desarrollador

# Contraseña del usuario inicial
DB_PASSWORD=secret_password

# Contraseña del usuario ROOT
DB_ROOT_PASSWORD=secret_root_password

# Red Docker compartida para que otros starters se conecten por nombre de contenedor
# Si se deja vacía, se usará <nombre-proyecto>_net.
MYSQL_NETWORK=
