# =============================================================================
# Configuración del Contenedor MinIO
# Uso: init-minio.sh project_ejemplo.conf
# =============================================================================

# Versión de la imagen oficial de MinIO (ej: latest, RELEASE.2025-06-01T19-22-09Z)
MINIO_VERSION=latest

# Puerto de la API S3 (acceso programático / SDKs)
MINIO_PORT_API=9000

# Puerto de la consola web de administración
MINIO_PORT_CONSOLE=9001

# IP del servidor de producción (opcional, solo para el leeme.txt)
PROD_SERVER_IP=

# =============================================================================
# CREDENCIALES
# =============================================================================
# Usuario raíz (equivalente a Access Key de AWS)
MINIO_ROOT_USER=minioadmin
# Contraseña raíz (equivalente a Secret Key de AWS — mínimo 8 caracteres)
MINIO_ROOT_PASSWORD=minioadmin123

# =============================================================================
# BUCKET INICIAL
# =============================================================================
# Nombre del bucket que se creará automáticamente al iniciar
# Dejar vacío para no crear ninguno
MINIO_DEFAULT_BUCKET=archivos

# =============================================================================
# RED DOCKER
# =============================================================================
# Red Docker compartida (vacío = usa proyectos-net por defecto)
MINIO_NETWORK=
