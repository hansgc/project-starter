# =============================================================================
# Configuración del Contenedor PostgreSQL
# Uso: init-postgres.sh project_ejemplo.conf
# =============================================================================

# Versión de la imagen oficial de PostgreSQL (ej: 15, 16, 17, latest)
PG_VERSION=latest

# Puerto local mapeado en el host
PG_PORT=5432

# IP del servidor de producción (opcional)
PROD_SERVER_IP=

# =============================================================================
# CONFIGURACIÓN DE BASE DE DATOS
# =============================================================================
# Nombre de la base de datos
DB_NAME=app_db
# Usuario de aplicación (distinto del superusuario postgres)
DB_USER=desarrollador
# Contraseña del usuario de aplicación
DB_PASSWORD=desarrollador123
# Contraseña del superusuario postgres
DB_ROOT_PASSWORD=root123
# Red Docker compartida (vacío = usa proyectos-net por defecto)
DB_NETWORK=
