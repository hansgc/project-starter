# Archivo de configuración para init-backup.sh
# Uso: ./init-backup.sh backup_ejemplo.conf
# El nombre del proyecto se deriva del nombre del archivo (ej: backup_ejemplo.conf → proyecto)

# Identificación del cliente
CLIENTE_ID=cliente-01

# Backblaze B2
B2_BUCKET=backup-cliente
B2_KEY_ID=YOUR_B2_KEY_ID
B2_APP_KEY=YOUR_B2_APP_KEY

# Schedule de Cron (expresión cron)
# 0 * * * *  = cada hora
# 0 0 * * *  = cada día a medianoche
# 0 2 * * *  = cada día a las 2 AM
BACKUP_SCHEDULE=0 * * * *

# Puertos locales mapeados en el host
PORT_DEV=8080
PORT_PROD=80

# Servidor de producción (opcional)
PROD_SERVER_IP=

# =============================================================================
# VARIABLES DE DESARROLLO (DEV)
# =============================================================================
DB_HOST_DEV=mysql
DB_PORT_DEV=3306
DB_NAME_DEV=mi_base_datos
DB_USER_DEV=usuario_app
DB_PASS_DEV=YOUR_DB_PASSWORD
DB_NETWORK_DEV=

# =============================================================================
# VARIABLES DE PRODUCCIÓN (PROD)
# =============================================================================
DB_HOST_PROD=mysql
DB_PORT_PROD=3306
DB_NAME_PROD=mi_base_datos
DB_USER_PROD=usuario_app
DB_PASS_PROD=YOUR_DB_PASSWORD
DB_NETWORK_PROD=

