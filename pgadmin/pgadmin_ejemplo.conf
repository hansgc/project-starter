# =============================================================================
# Configuración del Panel pgAdmin4 Standalone
# Uso: init-pgadmin.sh mi-pgadmin.conf
# =============================================================================

# Puerto local mapeado en el host para acceder al panel web
PGADMIN_PORT=8022

# IP del servidor de producción (opcional)
PROD_SERVER_IP=

# =============================================================================
# CREDENCIALES DE ACCESO AL PANEL pgAdmin
# =============================================================================
# Email y contraseña para iniciar sesión en pgAdmin
PGADMIN_EMAIL=admin@admin.com
PGADMIN_PASSWORD=admin123

# =============================================================================
# CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL
# =============================================================================
# Host de PostgreSQL (ej: host.docker.internal, o nombre del contenedor)
DB_HOST=host.docker.internal
# Puerto de PostgreSQL
DB_PORT=5432
# Nombre del servidor que se mostrará en pgAdmin
DB_SERVER_NAME=Mi PostgreSQL
# Red Docker externa a la que unirse para conectar con el contenedor PostgreSQL
DB_NETWORK=
