# =============================================================================
# Configuración del Panel phpMyAdmin Standalone
# Uso: init-phpmyadmin.sh mi-pma.conf
# =============================================================================

# Puerto local mapeado en el host para acceder al panel web en desarrollo
PMA_PORT_DEV=8011

# Puerto local mapeado en el host para acceder al panel web en producción
PMA_PORT_PROD=8021

# IP del servidor de producción (opcional)
PROD_SERVER_IP=

# Host de la base de datos MySQL (ej: host.docker.internal, o la IP de tu docker host)
PMA_HOST=host.docker.internal

# Puerto de la base de datos MySQL a la que conectarse (desarrollo)
PMA_DB_PORT_DEV=3306

# Puerto de la base de datos MySQL a la que conectarse (producción)
PMA_DB_PORT_PROD=3306

# Permitir ingresar cualquier Host en la pantalla de login (1 = Sí, 0 = No)
PMA_ARBITRARY=1

# (Opcional) Red Docker externa a la que unirse para conectar con el contenedor MySQL directamente
# Si se define: PMA_HOST debe ser el nombre del contenedor MySQL (ej: mysql-dbcentral_db)
# Si se omite:  phpMyAdmin usa host.docker.internal (MySQL debe tener su puerto publicado al host)
DB_NETWORK=
